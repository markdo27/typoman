<style>
:root { --bg: #0015ff; --bg-glass: rgba(0, 15, 180, 0.7); }

html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:#ffffff;font-family:'JetBrains Mono',monospace;-webkit-font-smoothing:antialiased;}

/* Custom Range Slider */
input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  background: rgba(255,255,255,0.2);

        </svg>

<script>
// ═══════════════════════════════════════════════════════════════════════
// TYPOMAN V3: KINETIC TYPOGRAPHY & PROCEDURAL MOTION SUITE
// ═══════════════════════════════════════════════════════════════════════

const canvas = document.getElementById('motionCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

// Global Suite State
const state = {
  currentAnim: 0,
  variationIdx: 0,
  text: "HELVETICA",
  playing: true,
  speed: 1.0,
  loopDuration: 8.0,
  time: 0,
  width: 0,
  height: 0,
  dpr: Math.min(window.devicePixelRatio || 1, 2),
  mouseX: -9999,
  mouseY: -9999,
  isHovering: false,
  bgColor: '#0015ff'
};

// 9 Animation Definitions with Variations
const ANIMATIONS = [
  {
    id: 'type-hull',
    name: 'TYPE HULL',
    title: '01: CONVEX HULL TYPOGRAPHY',
    desc: '4 spatial layouts with dynamic Andrew Monotone convex hull',
    variations: ['Drift', 'Snap', 'Elastic']
  },
  {
    id: 'pulley-belt',
    name: 'PULLEY BELT',
    title: '02: PULLEY BELT ENGINE',
    desc: '6 circular nodes with smooth external tangent convex hull',
    variations: ['Lissajous', 'Orbital', 'Figure-8', 'Elastic']
  },
  {
    id: 'swarm',
    name: 'SWARM',
    title: '03: BREATHING CIRCLE SWARM',
    desc: '400 circular particles expanding with Perlin jitter',
    variations: ['Golden Spiral', 'Grid Expand', 'Random Burst']
  },
  {
    id: 'vector-field',
    name: 'VECTOR FIELD',
    title: '04: INTERACTIVE VECTOR FIELD',
    desc: '16x10 tick grid rotating towards focus point',
    variations: ['Lissajous', 'Spiral', 'Mouse Only']
  },
  {
    id: 'undulation',
    name: 'UNDULATION',
    title: '05: UNDULATING WAVE BASELINE',
    desc: 'Heavy stroked text translating along undulating wave',
    variations: ['Sine Wave', 'Zigzag', 'Bounce']
  },
  {
    id: 'network',
    name: 'NETWORK',
    title: '06: ANIMATED GRAPH NETWORK',
    desc: '8 ring nodes with inward-bowed quadratic connections',
    variations: ['Orbit', 'Breathe', 'Swirl']
  },
  {
    id: 'radar',
    name: 'RADAR',
    title: '07: RADIAL TYPOGRAPHY RADAR',
    desc: 'Cartesian grid scanned by moving satellite hub',
    variations: ['Lissajous', 'Circular', 'Random Walk']
  },
  {
    id: 'rollercoaster',
    name: 'ROLLERCOASTER',
    title: '08: ROLLERCOASTER TRACK',
    desc: '3-rail parallel ribbon spline with letter tokens',
    variations: ['Lissajous Knot', 'Figure-8', 'Cardioid']
  },
  {
    id: 'morph',
    name: 'MORPH',
    title: '09: TYPOGRAPHY MORPH',
    desc: 'Abstract geometric primitives morphing into wordmark',
    variations: ['Geometric', 'Pixel Grid', 'Shatter']
  }
];

// ═══════════════════════════════════════════════════════════════════════
// EASING LIBRARY
// ═══════════════════════════════════════════════════════════════════════

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1;
}

function easeInOutQuint(t) {
  return t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2;
}

function easeOutBack(t) {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function easeOutElastic(t) {
  if (t === 0 || t === 1) return t;
  return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
}

function easeStep(t, steps) {
  return Math.floor(t * steps) / steps;
}

// ═══════════════════════════════════════════════════════════════════════
// ANIMATION 01: CONVEX HULL TYPOGRAPHY ENGINE
// ═══════════════════════════════════════════════════════════════════════

function generateLayouts(count) {
  const layoutA = [];
  const V0 = { x: -0.42, y: -0.38 }, V1 = { x: 0.44, y: -0.12 }, V2 = { x: -0.18, y: 0.42 };
  for (let i = 0; i < 8; i++) layoutA.push({ x: V0.x + (V1.x - V0.x) * (i / 8), y: V0.y + (V1.y - V0.y) * (i / 8), isOuter: true });
  for (let i = 0; i < 8; i++) layoutA.push({ x: V1.x + (V2.x - V1.x) * (i / 8), y: V1.y + (V2.y - V1.y) * (i / 8), isOuter: true });
  for (let i = 0; i < 8; i++) layoutA.push({ x: V2.x + (V0.x - V2.x) * (i / 8), y: V2.y + (V0.y - V2.y) * (i / 8), isOuter: true });
  for (let i = 0; i < count - 24; i++) {
    const r1 = Math.sqrt((i + 1) / (count - 23)), r2 = (i * 0.61803398875) % 1;
    const a = 1 - r1, b = r1 * (1 - r2), c = r1 * r2;
    layoutA.push({ x: (a * V0.x + b * V1.x + c * V2.x) * 0.78, y: (a * V0.y + b * V1.y + c * V2.y) * 0.78, isOuter: false });
  }

  const layoutB = [];
  const oct = [{ x: -0.32, y: -0.38 }, { x: 0.08, y: -0.42 }, { x: 0.38, y: -0.26 }, { x: 0.44, y: 0.06 }, { x: 0.30, y: 0.38 }, { x: -0.06, y: 0.42 }, { x: -0.38, y: 0.28 }, { x: -0.44, y: -0.08 }];
  for (let i = 0; i < 22; i++) {
    const t = (i / 22) * 8, idx = Math.floor(t), frac = t - idx;
    layoutB.push({ x: oct[idx % 8].x + (oct[(idx + 1) % 8].x - oct[idx % 8].x) * frac, y: oct[idx % 8].y + (oct[(idx + 1) % 8].y - oct[idx % 8].y) * frac, isOuter: true });
  }
  for (let i = 0; i < count - 22; i++) {
    const ang = (i / (count - 22)) * Math.PI * 2, rad = 0.12 + ((i % 3) * 0.07);
    layoutB.push({ x: Math.cos(ang) * rad, y: Math.sin(ang) * rad * 0.85, isOuter: false });
  }

  const layoutC = [];
  const T0 = { x: -0.20, y: -0.42 }, T1 = { x: 0.26, y: -0.34 }, T2 = { x: 0.42, y: 0.40 }, T3 = { x: -0.38, y: 0.38 };
  for (let i = 0; i < 4; i++) layoutC.push({ x: T0.x + (T1.x - T0.x) * (i / 4), y: T0.y + (T1.y - T0.y) * (i / 4), isOuter: true });
  for (let i = 0; i < 8; i++) layoutC.push({ x: T1.x + (T2.x - T1.x) * (i / 8), y: T1.y + (T2.y - T1.y) * (i / 8), isOuter: true });
  for (let i = 0; i < 4; i++) layoutC.push({ x: T2.x + (T3.x - T2.x) * (i / 4), y: T2.y + (T3.y - T2.y) * (i / 4), isOuter: true });
  for (let i = 0; i < 8; i++) layoutC.push({ x: T3.x + (T0.x - T3.x) * (i / 8), y: T3.y + (T0.y - T3.y) * (i / 8), isOuter: true });
  for (let i = 0; i < count - 24; i++) {
    const u = ((i % 4) + 1) / 5, v = (Math.floor(i / 4) + 1) / (Math.ceil((count - 24) / 4) + 1);
    layoutC.push({ x: (T0.x + (T1.x - T0.x) * u) * (1 - v) + (T3.x + (T2.x - T3.x) * u) * v, y: (T0.y + (T1.y - T0.y) * u) * (1 - v) + (T3.y + (T2.y - T3.y) * u) * v, isOuter: false });
  }

  const layoutD = [];
  const poly = [{ x: -0.28, y: -0.26 }, { x: 0.16, y: -0.32 }, { x: 0.36, y: -0.06 }, { x: 0.28, y: 0.28 }, { x: -0.06, y: 0.34 }, { x: -0.34, y: 0.14 }];
  for (let i = 0; i < 20; i++) {
    const t = (i / 20) * 6, idx = Math.floor(t), frac = t - idx;
    layoutD.push({ x: poly[idx % 6].x + (poly[(idx + 1) % 6].x - poly[idx % 6].x) * frac, y: poly[idx % 6].y + (poly[(idx + 1) % 6].y - poly[idx % 6].y) * frac, isOuter: true });
  }
  for (let i = 0; i < count - 20; i++) {
    const r = (i + 1) / (count - 19), a = i * 2.399963;
    layoutD.push({ x: Math.cos(a) * 0.16 * Math.sqrt(r), y: Math.sin(a) * 0.16 * Math.sqrt(r), isOuter: false });
  }

  return [layoutA, layoutB, layoutC, layoutD];
}

let typeCharacters = [];
let typeLayouts = [];

function initTypeCharacters() {
  const text = state.text.toUpperCase();
  typeCharacters = [];
  for (let inst = 0; inst < 4; inst++) {
    for (let c = 0; c < text.length; c++) {
      typeCharacters.push({
        char: text[c],
        driftPhase: Math.random() * Math.PI * 2
      });
    }
  }
  typeLayouts = generateLayouts(typeCharacters.length);
}
initTypeCharacters();

function convexHull(points) {
  if (points.length <= 2) return points.slice();
  const pts = points.slice().sort((a, b) => (a.x === b.x ? a.y - b.y : a.x - b.x));
  function cross(o, a, b) { return (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x); }
  const lower = [];
  for (let i = 0; i < pts.length; i++) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], pts[i]) <= 0) lower.pop();
    lower.push(pts[i]);
  }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], pts[i]) <= 0) upper.pop();
    upper.push(pts[i]);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}

function renderAnim1_TypeHull(t, W, H) {
  const variant = state.variationIdx; // 0=Drift, 1=Snap, 2=Elastic
  const cycle = ((t % 1.0) + 1.0) % 1.0;
  const stageFraction = cycle * 4;
  const stage = Math.min(3, Math.max(0, Math.floor(stageFraction)));
  const nextStage = (stage + 1) % 4;
  const rawStageT = Math.max(0, Math.min(1, stageFraction - stage));

  const pA = typeLayouts[stage];
  const pB = typeLayouts[nextStage];
  const spanX = Math.min(W * 0.85, H * 1.35 * 0.85);
  const spanY = Math.min(H * 0.78, W * 0.65);
  const cx = W / 2, cy = H / 2;

  const fontSize = Math.max(19, Math.min(Math.round(W * 0.022), 28));
  ctx.font = `700 ${fontSize}px Helvetica, Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const letterPoints = [];
  for (let i = 0; i < typeCharacters.length; i++) {
    const ch = typeCharacters[i];
    const posA = pA[i % pA.length];
    const posB = pB[i % pB.length];
    const stagger = (i / typeCharacters.length) * 0.08;
    let charT = Math.max(0, Math.min(1, (rawStageT - stagger) / (1 - stagger * 1.5)));

    // Variation easing
    let charEased;
    if (variant === 1) {
      // Snap: stepped quantized motion
      charEased = easeStep(charT, 6);
    } else if (variant === 2) {
      // Elastic: spring overshoot
      charEased = easeOutElastic(charT);
    } else {
      // Drift: smooth cubic
      charEased = easeInOutCubic(charT);
    }

    const nx = posA.x + (posB.x - posA.x) * charEased;
    const ny = posA.y + (posB.y - posA.y) * charEased;
    const isInterior = !posA.isOuter || !posB.isOuter;
    const drift = isInterior ? 5 : 1.5;
    const dx = Math.sin(t * Math.PI * 4 + ch.driftPhase) * drift;
    const dy = Math.cos(t * Math.PI * 3.5 + ch.driftPhase * 1.3) * drift;

    const px = cx + nx * spanX + dx;
    const py = cy + ny * spanY + dy;
    letterPoints.push({ x: px, y: py, char: ch.char });
  }

  // Draw Convex Hull with glow
  const hull = convexHull(letterPoints);
  if (hull.length > 2) {
    ctx.save();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(255, 255, 255, 0.4)';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(hull[0].x, hull[0].y);
    for (let h = 1; h < hull.length; h++) ctx.lineTo(hull[h].x, hull[h].y);
    ctx.closePath();
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#ffffff';
    for (let h = 0; h < hull.length; h++) {
      ctx.beginPath();
      ctx.arc(hull[h].x, hull[h].y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Draw characters
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < letterPoints.length; i++) {
    ctx.fillText(letterPoints[i].char, letterPoints[i].x, letterPoints[i].y);
  }
}

// ═══════════════════════════════════════════════════════════════════════
// ANIMATION 02: PULLEY BELT TANGENT CONVEX HULL ENGINE
// ═══════════════════════════════════════════════════════════════════════

const pulleyNodes = [
  { r: 22, x: 0, y: 0 }, { r: 19, x: 0, y: 0 }, { r: 24, x: 0, y: 0 },
  { r: 20, x: 0, y: 0 }, { r: 23, x: 0, y: 0 }, { r: 21, x: 0, y: 0 }
];

function getCircleTangentConvexHull(circles) {
  const n = circles.length;
  if (n <= 1) return null;
  const valid = [];
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      if (i === j) continue;
      const c1 = circles[i], c2 = circles[j];
      const dx = c2.x - c1.x, dy = c2.y - c1.y, d = Math.hypot(dx, dy);
      if (d <= Math.abs(c1.r - c2.r) + 0.5) continue;
      const gamma = Math.atan2(dy, dx);
      const beta = Math.acos(Math.max(-1, Math.min(1, (c1.r - c2.r) / d)));
      const alpha = gamma + beta;
      const nx = Math.cos(alpha), ny = Math.sin(alpha);
      const p1x = c1.x + c1.r * nx, p1y = c1.y + c1.r * ny;
      let ok = true;
      for (let k = 0; k < n; k++) {
        if (k === i || k === j) continue;
        const ck = circles[k];
        if ((ck.x - p1x) * nx + (ck.y - p1y) * ny + ck.r > 1e-3) { ok = false; break; }
      }
      if (ok) {
        valid.push({ from: i, to: j, angle: alpha, p1: { x: p1x, y: p1y }, p2: { x: c2.x + c2.r * nx, y: c2.y + c2.r * ny } });
      }
    }
  }
  if (valid.length === 0) return null;
  const next = new Map();
  for (const t of valid) next.set(t.from, t);
  const cycle = [];
  let curr = valid[0].from;
  const visited = new Set();
  while (!visited.has(curr)) {
    visited.add(curr);
    const t = next.get(curr);
    if (!t) break;
    cycle.push(t);
    curr = t.to;
  }
  return cycle;
}

function renderAnim2_PulleyBelt(t, W, H) {
  const variant = state.variationIdx; // 0=Lissajous, 1=Orbital, 2=Figure-8, 3=Elastic
  const twoPi = Math.PI * 2;
  const cx = W / 2, cy = H / 2;
  const spanX = Math.min(W * 0.42, H * 0.65 * 0.42);
  const spanY = Math.min(H * 0.38, W * 0.32);

  // Position nodes based on variation
  for (let i = 0; i < 6; i++) {
    let nx, ny;
    const phase = i * twoPi / 6;

    if (variant === 1) {
      // Orbital: circular orbits with varying radii
      const orbitR = 0.35 + (i % 3) * 0.12;
      const speed = 1 + (i % 2) * 0.5;
      nx = Math.cos(t * twoPi * speed + phase) * orbitR;
      ny = Math.sin(t * twoPi * speed + phase) * orbitR * 0.85;
    } else if (variant === 2) {
      // Figure-8: infinity-shaped paths
      const speed = 0.8 + (i % 3) * 0.2;
      const offset = i * 0.15;
      nx = Math.sin(t * twoPi * speed + phase) * (0.55 + offset * 0.3);
      ny = Math.sin(t * twoPi * speed * 2 + phase) * (0.35 + offset * 0.2);
    } else if (variant === 3) {
      // Elastic: spring bounce with overshoot
      const baseAngle = phase + t * twoPi * 0.4;
      const bounce = Math.sin(t * twoPi * 3 + i * 1.2) * 0.15;
      const r = 0.38 + bounce;
      nx = Math.cos(baseAngle) * r + Math.sin(t * twoPi * 2 + i) * 0.08;
      ny = Math.sin(baseAngle) * r * 0.85 + Math.cos(t * twoPi * 1.5 + i) * 0.06;
    } else {
      // Lissajous (default)
      const params = [
        { bx: -0.05, by: -0.15, Ax: 0.72, Ay: 0.60, fx: 1, fy: 2, px: 0, py: Math.PI / 3 },
        { bx: 0.18,  by: -0.08, Ax: 0.65, Ay: 0.75, fx: 2, fy: 1, px: Math.PI / 4, py: 0 },
        { bx: 0.12,  by: 0.15,  Ax: 0.75, Ay: 0.58, fx: 3, fy: 2, px: Math.PI / 2, py: Math.PI / 4 },
        { bx: -0.08, by: 0.20,  Ax: 0.68, Ay: 0.65, fx: 1, fy: 3, px: Math.PI, py: Math.PI / 6 },
        { bx: -0.22, by: 0.05,  Ax: 0.60, Ay: 0.78, fx: 2, fy: 1, px: 3 * Math.PI / 4, py: Math.PI / 2 },
        { bx: 0.02,  by: 0.02,  Ax: 0.45, Ay: 0.45, fx: 2, fy: 2, px: 0, py: Math.PI / 2 }
      ];
      const p = params[i];
      nx = p.bx + p.Ax * 0.5 * Math.cos(p.fx * twoPi * t + p.px);
      ny = p.by + p.Ay * 0.5 * Math.sin(p.fy * twoPi * t + p.py);
    }

    pulleyNodes[i].x = cx + nx * spanX;
    pulleyNodes[i].y = cy + ny * spanY;
  }

  // Draw Tangent Belt
  const cycle = getCircleTangentConvexHull(pulleyNodes);
  if (cycle && cycle.length > 0) {
    ctx.save();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(255, 255, 255, 0.3)';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    for (let i = 0; i < cycle.length; i++) {
      const curr = cycle[i], next = cycle[(i + 1) % cycle.length], c = pulleyNodes[curr.to];
      if (i === 0) ctx.moveTo(curr.p1.x, curr.p1.y);
      ctx.lineTo(curr.p2.x, curr.p2.y);
      let sA = curr.angle, eA = next.angle;
      while (eA < sA) eA += Math.PI * 2;
      if (eA - sA > Math.PI * 2) eA -= Math.PI * 2;
      ctx.arc(c.x, c.y, c.r, sA, eA, false);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.lineDashOffset = -(t * 220);
    ctx.stroke();
    ctx.restore();
  }

  // Draw 6 Circles
  const labelText = (state.text.length >= 6 ? state.text : (state.text + "PULLEY")).toUpperCase();
  pulleyNodes.forEach((c, i) => {
    ctx.save();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(c.x, c.y, 2.5, 0, Math.PI * 2);
    ctx.fill();

    const spokeRot = (t * Math.PI * 6 * (i % 2 === 0 ? 1 : -1)) + (i * Math.PI / 3);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.lineWidth = 1;
    for (let s = 0; s < 3; s++) {
      const a = spokeRot + (s * Math.PI * 2 / 3);
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      ctx.lineTo(c.x + Math.cos(a) * (c.r - 2), c.y + Math.sin(a) * (c.r - 2));
      ctx.stroke();
    }

    ctx.font = '700 11px Helvetica, Arial, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(labelText[i] || (i + 1).toString(), c.x, c.y - c.r - 12);
    ctx.restore();
  });
}

// ═══════════════════════════════════════════════════════════════════════
// ANIMATION 03: BREATHING CIRCLE SWARM (400 PARTICLES)
// ═══════════════════════════════════════════════════════════════════════

const SWARM_COUNT = 400;
const swarmParticles = [];
for (let i = 0; i < SWARM_COUNT; i++) {
  swarmParticles.push({
    normR: Math.sqrt((i + 0.5) / SWARM_COUNT),
    baseAngle: i * 2.399963, // Golden angle
    freqR: 1 + (i % 3),
    freqT: 1 + ((i * 3) % 4),
    phase: Math.random() * Math.PI * 2,
    // Grid position for Grid Expand variant
    gridX: (i % 20) / 19 - 0.5,
    gridY: Math.floor(i / 20) / 19 - 0.5,
    // Random position for Random Burst variant
    randAngle: Math.random() * Math.PI * 2,
    randR: Math.random()
  });
}

function renderAnim3_Swarm(t, W, H) {
  const variant = state.variationIdx; // 0=Golden Spiral, 1=Grid Expand, 2=Random Burst
  const cx = W / 2, cy = H / 2;
  const pulse = 0.5 - 0.5 * Math.cos(t * Math.PI * 2);
  const currentMaxRadius = 80 + pulse * 180;

  ctx.save();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.fillStyle = state.bgColor;

  for (let i = 0; i < SWARM_COUNT; i++) {
    const p = swarmParticles[i];
    let px, py;

    if (variant === 1) {
      // Grid Expand: square grid morphing to circle
      const gridScale = 80 + pulse * 200;
      const gridPx = cx + p.gridX * gridScale * 2.5;
      const gridPy = cy + p.gridY * gridScale * 2.5;
      // Circular position
      const circAngle = p.baseAngle + t * 0.4;
      const circR = p.normR * currentMaxRadius;
      const circPx = cx + Math.cos(circAngle) * circR;
      const circPy = cy + Math.sin(circAngle) * circR;
      // Blend between grid and circle
      const blend = 0.5 - 0.5 * Math.cos(t * Math.PI * 4);
      px = gridPx + (circPx - gridPx) * blend;
      py = gridPy + (circPy - gridPy) * blend;
    } else if (variant === 2) {
      // Random Burst: explosive scatter from center
      const burstPhase = (t * 2 + p.phase / Math.PI) % 1.0;
      const burstEased = easeOutBack(Math.min(1, burstPhase * 1.3));
      const burstR = burstEased * (80 + pulse * 200);
      const burstAngle = p.randAngle + Math.sin(t * Math.PI * 2 + p.phase) * 0.3;
      px = cx + Math.cos(burstAngle) * burstR * p.randR;
      py = cy + Math.sin(burstAngle) * burstR * p.randR;
    } else {
      // Golden Spiral (default)
      const driftAngle = Math.sin(t * Math.PI * 4 + p.phase) * 0.28;
      const radialJitter = Math.cos(t * Math.PI * 6 + p.phase * 1.5) * 8;
      const r = p.normR * currentMaxRadius + radialJitter;
      const angle = p.baseAngle + driftAngle + (t * 0.4);
      px = cx + Math.cos(angle) * r;
      py = cy + Math.sin(angle) * r;
    }

    // Subtle glow for particles near center
    const distCenter = Math.hypot(px - cx, py - cy);
    if (distCenter < 60) {
      ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
      ctx.shadowBlur = 6;
    } else {
      ctx.shadowBlur = 0;
    }

    ctx.beginPath();
    ctx.arc(px, py, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
// ANIMATION 04: INTERACTIVE VECTOR FIELD (16 x 10 TICKS)
// ═══════════════════════════════════════════════════════════════════════

function renderAnim4_VectorField(t, W, H) {
  const variant = state.variationIdx; // 0=Lissajous, 1=Spiral, 2=Mouse Only
  const cols = 16, rows = 10;
  const padX = W * 0.1, padY = H * 0.15;
  const stepX = (W - padX * 2) / (cols - 1);
  const stepY = (H - padY * 2) / (rows - 1);

  // Focus point based on variation
  let focusX, focusY;
  if (variant === 1) {
    // Spiral: Archimedean spiral
    const spiralT = (t * 0.5) % 1.0;
    const spiralR = spiralT * Math.min(W, H) * 0.4;
    const spiralAngle = spiralT * Math.PI * 8;
    focusX = W / 2 + Math.cos(spiralAngle) * spiralR;
    focusY = H / 2 + Math.sin(spiralAngle) * spiralR;
  } else if (variant === 2) {
    // Mouse Only: only responds to cursor
    focusX = state.isHovering ? state.mouseX : W / 2;
    focusY = state.isHovering ? state.mouseY : H / 2;
  } else {
    // Lissajous (default)
    focusX = W / 2 + Math.cos(t * Math.PI * 4) * (W * 0.35);
    focusY = H / 2 + Math.sin(t * Math.PI * 6 + Math.PI / 4) * (H * 0.30);
  }

  // Override with mouse if hovering (except Mouse Only which already uses it)
  if (variant !== 2 && state.isHovering && state.mouseX > 0) {
    focusX = state.mouseX;
    focusY = state.mouseY;
  }

  // Draw Focal Target Ring
  ctx.save();
  ctx.strokeStyle = '#00ff44';
  ctx.lineWidth = 1.5;
  ctx.shadowColor = 'rgba(0, 255, 68, 0.5)';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(focusX, focusY, 22, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#00ff44';
  ctx.beginPath();
  ctx.arc(focusX, focusY, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Draw 16x10 Grid of Ticks
  const tickLen = 22;
  const halfLen = tickLen / 2;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const gx = padX + c * stepX;
      const gy = padY + r * stepY;

      const dx = focusX - gx;
      const dy = focusY - gy;
      const dist = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);

      ctx.save();
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';

      if (dist < 220) {
        const factor = 1 - (dist / 220);
        const red = Math.round(255 * (1 - factor));
        const blue = Math.round(255 * (1 - factor) + 68 * factor);
        ctx.strokeStyle = `rgb(${red}, 255, ${blue})`;
        if (dist < 80) {
          ctx.shadowColor = `rgba(0, 255, 68, ${factor * 0.4})`;
          ctx.shadowBlur = 6;
        }
      } else {
        ctx.strokeStyle = '#ffffff';
      }

      ctx.beginPath();
      ctx.moveTo(gx - Math.cos(angle) * halfLen, gy - Math.sin(angle) * halfLen);
      ctx.lineTo(gx + Math.cos(angle) * halfLen, gy + Math.sin(angle) * halfLen);
      ctx.stroke();
      ctx.restore();
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
// ANIMATION 05: UNDULATING WAVE BASELINE
// ═══════════════════════════════════════════════════════════════════════

function renderAnim5_Undulation(t, W, H) {
  const variant = state.variationIdx; // 0=Sine Wave, 1=Zigzag, 2=Bounce
  const text = state.text.length > 0 ? `-${state.text}-` : "-STROKE-";
  const cx = W / 2, cy = H / 2;
  const waveWidth = Math.min(W * 0.8, 900);
  const maxAmp = H * 0.22;

  let ampFunc;
  if (variant === 1) {
    // Zigzag: sawtooth wave
    const zigPhase = (t * 2) % 1.0;
    const zigVal = zigPhase < 0.5 ? zigPhase * 4 - 1 : 3 - zigPhase * 4;
    ampFunc = (u) => zigVal * maxAmp * (1 - Math.abs(u) * 0.4);
  } else if (variant === 2) {
    // Bounce: abs-sine bounce
    const bounceAmp = Math.abs(Math.sin(t * Math.PI * 2)) * maxAmp;
    ampFunc = (u) => -bounceAmp * Math.cos(u * Math.PI);
  } else {
    // Sine Wave (default)
    const amp = Math.sin(t * Math.PI * 2) * maxAmp;
    ampFunc = (u) => amp * Math.cos(u * Math.PI / 2);
  }

  // Draw baseline curve
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  const samples = 60;
  for (let s = 0; s <= samples; s++) {
    const u = (s / samples) * 2 - 1;
    const px = cx + u * (waveWidth / 2);
    const py = cy + ampFunc(u);
    if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.restore();

  // Render Stroked Glyphs along the baseline
  const fontSize = Math.max(38, Math.min(Math.round(W * 0.075), 90));
  ctx.save();
  ctx.font = `900 ${fontSize}px Helvetica, Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(255, 255, 255, 0.25)';
  ctx.shadowBlur = 4;

  const totalChars = text.length;
  for (let i = 0; i < totalChars; i++) {
    const u = ((i + 0.5) / totalChars) * 1.7 - 0.85;
    const px = cx + u * (waveWidth / 2);
    const py = cy + ampFunc(u);

    // Tangent angle (numerical derivative)
    const eps = 0.001;
    const py2 = cy + ampFunc(u + eps);
    const slope = (py2 - py) / (eps * waveWidth / 2);
    const angle = Math.atan(slope);

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(angle);
    ctx.strokeText(text[i], 0, 0);
    ctx.restore();
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
// ANIMATION 06: ANIMATED GRAPH NETWORK (8 RING NODES)
// ═══════════════════════════════════════════════════════════════════════

const netKeyframes = [
  [{ x: -0.32, y: -0.22 }, { x: 0.05, y: -0.35 }, { x: 0.35, y: -0.18 }, { x: 0.38, y: 0.12 },
   { x: 0.18, y: 0.32 }, { x: -0.15, y: 0.36 }, { x: -0.38, y: 0.15 }, { x: -0.05, y: -0.05 }],
  [{ x: -0.12, y: -0.14 }, { x: 0.08, y: -0.16 }, { x: 0.16, y: -0.04 }, { x: 0.12, y: 0.12 },
   { x: -0.02, y: 0.15 }, { x: -0.14, y: 0.08 }, { x: -0.18, y: -0.06 }, { x: 0.01, y: -0.01 }],
  [{ x: -0.38, y: -0.35 }, { x: -0.26, y: -0.24 }, { x: -0.14, y: -0.12 }, { x: -0.02, y: 0.02 },
   { x: 0.10, y: 0.14 }, { x: 0.22, y: 0.24 }, { x: 0.34, y: 0.35 }, { x: 0.02, y: -0.15 }]
];

function renderAnim6_Network(t, W, H) {
  const variant = state.variationIdx; // 0=Orbit, 1=Breathe, 2=Swirl
  const cx = W / 2, cy = H / 2;
  const span = Math.min(W * 0.85, H * 0.78);

  const currentNodes = [];

  if (variant === 1) {
    // Breathe: expand/contract radial
    const breatheR = 0.15 + (0.5 - 0.5 * Math.cos(t * Math.PI * 2)) * 0.28;
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2 + t * Math.PI * 0.3;
      currentNodes.push({
        x: cx + Math.cos(angle) * breatheR * span,
        y: cy + Math.sin(angle) * breatheR * span
      });
    }
  } else if (variant === 2) {
    // Swirl: rotational vortex
    for (let i = 0; i < 8; i++) {
      const baseAngle = (i / 8) * Math.PI * 2;
      const r = 0.18 + (i % 3) * 0.08 + Math.sin(t * Math.PI * 4 + i) * 0.06;
      const swirlAngle = baseAngle + t * Math.PI * 2 * (0.5 + (i % 2) * 0.3);
      currentNodes.push({
        x: cx + Math.cos(swirlAngle) * r * span,
        y: cy + Math.sin(swirlAngle) * r * span
      });
    }
  } else {
    // Orbit (default 3-keyframe)
    const stage = (t * 3) % 3;
    const idx = Math.floor(stage);
    const nextIdx = (idx + 1) % 3;
    const ease = easeInOutCubic(stage - idx);
    const kA = netKeyframes[idx];
    const kB = netKeyframes[nextIdx];
    for (let i = 0; i < 8; i++) {
      const nx = kA[i].x + (kB[i].x - kA[i].x) * ease;
      const ny = kA[i].y + (kB[i].y - kA[i].y) * ease;
      currentNodes.push({ x: cx + nx * span, y: cy + ny * span });
    }
  }

  // Connect close node pairs with bowed quadratic curves
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.lineWidth = 1;
  ctx.lineCap = 'round';

  for (let i = 0; i < 8; i++) {
    for (let j = i + 1; j < 8; j++) {
      const p1 = currentNodes[i], p2 = currentNodes[j];
      const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      if (dist < span * 0.45) {
        const mx = (p1.x + p2.x) / 2;
        const my = (p1.y + p2.y) / 2;
        const cpx = mx + (cx - mx) * 0.28;
        const cpy = my + (cy - my) * 0.28;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.quadraticCurveTo(cpx, cpy, p2.x, p2.y);
        ctx.stroke();
      }
    }
  }

  // Draw 8 Ring Nodes
  for (let i = 0; i < 8; i++) {
    const node = currentNodes[i];
    ctx.fillStyle = state.bgColor;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(node.x, node.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(node.x, node.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
// ANIMATION 07: RADIAL TYPOGRAPHY RADAR
// ═══════════════════════════════════════════════════════════════════════

let radarWalkX = 0, radarWalkY = 0, radarWalkVx = 1, radarWalkVy = 0.7;

function renderAnim7_Radar(t, W, H) {
  const variant = state.variationIdx; // 0=Lissajous, 1=Circular, 2=Random Walk
  const word = state.text.length > 0 ? state.text.toUpperCase() : "HELVETICA";
  const spacing = 48;
  const cols = Math.ceil(W / spacing) + 1;
  const rows = Math.ceil(H / spacing) + 1;

  // Satellite Hub trajectory based on variation
  let hubX, hubY;
  if (variant === 1) {
    // Circular: constant radius sweep
    const sweepAngle = t * Math.PI * 2;
    hubX = W / 2 + Math.cos(sweepAngle) * (W * 0.32);
    hubY = H / 2 + Math.sin(sweepAngle) * (H * 0.28);
  } else if (variant === 2) {
    // Random Walk: Brownian-like wander with bounds
    radarWalkVx += (Math.sin(t * 17.3) * 0.4);
    radarWalkVy += (Math.cos(t * 13.7) * 0.4);
    radarWalkVx *= 0.98;
    radarWalkVy *= 0.98;
    radarWalkX += radarWalkVx * 0.8;
    radarWalkY += radarWalkVy * 0.8;
    // Soft bounds
    if (Math.abs(radarWalkX) > W * 0.35) radarWalkVx -= radarWalkX * 0.01;
    if (Math.abs(radarWalkY) > H * 0.30) radarWalkVy -= radarWalkY * 0.01;
    hubX = W / 2 + radarWalkX;
    hubY = H / 2 + radarWalkY;
  } else {
    // Lissajous (default)
    hubX = W / 2 + Math.cos(t * Math.PI * 2) * (W * 0.32);
    hubY = H / 2 + Math.sin(t * Math.PI * 4) * (H * 0.26);
  }

  const radarRadius = 250;

  ctx.save();
  ctx.font = '700 13px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const gx = c * spacing;
      const gy = r * spacing;
      const char = word[(c + r * 3) % word.length];
      const dist = Math.hypot(hubX - gx, hubY - gy);

      if (dist < radarRadius) {
        const alpha = 1 - (dist / radarRadius);
        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.65})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(hubX, hubY);
        ctx.lineTo(gx, gy);
        ctx.stroke();

        const scale = 1.0 + alpha * 0.7;
        const angle = -Math.PI / 4 + (alpha * Math.PI * 0.5);

        ctx.save();
        ctx.translate(gx, gy);
        ctx.rotate(angle);
        ctx.scale(scale, scale);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(char, 0, 0);
        ctx.restore();
      } else {
        ctx.save();
        ctx.translate(gx, gy);
        ctx.rotate(-Math.PI / 4);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.fillText(char, 0, 0);
        ctx.restore();
      }
    }
  }

  // Draw Satellite Hub
  ctx.save();
  ctx.translate(hubX, hubY);
  ctx.fillStyle = state.bgColor;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(255, 255, 255, 0.3)';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(0, 0, 42, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.beginPath();
  ctx.arc(0, 0, 250, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Circular Wordmark inside Hub
  ctx.font = '800 10px Syne, sans-serif';
  ctx.fillStyle = '#ffffff';
  const hubChars = word.split('');
  for (let i = 0; i < hubChars.length; i++) {
    const a = (i / hubChars.length) * Math.PI * 2 + (t * Math.PI * 2);
    ctx.save();
    ctx.rotate(a);
    ctx.fillText(hubChars[i], 0, -28);
    ctx.restore();
  }

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(0, 0, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
// ANIMATION 08: ROLLERCOASTER TYPOGRAPHY TRACK
// ═══════════════════════════════════════════════════════════════════════

function getRollercoasterPos(u, W, H, variant) {
  const cx = W / 2, cy = H / 2;
  const Ax = Math.min(W * 0.36, 460);
  const Ay = Math.min(H * 0.32, 340);
  let x, y, dx, dy;

  if (variant === 1) {
    // Figure-8: infinity path
    x = cx + Math.sin(u) * Ax * 1.1;
    y = cy + Math.sin(u * 2) * Ay * 0.7;
    dx = Math.cos(u) * Ax * 1.1;
    dy = Math.cos(u * 2) * 2 * Ay * 0.7;
  } else if (variant === 2) {
    // Cardioid: heart-shaped
    const r = Ax * 0.45 * (1 - Math.cos(u));
    x = cx + r * Math.cos(u);
    y = cy + r * Math.sin(u) * 0.85;
    dx = -Ax * 0.45 * (-Math.sin(u) * Math.cos(u) + (1 - Math.cos(u)) * (-Math.sin(u)));
    dy = Ax * 0.45 * 0.85 * (Math.sin(u) * Math.sin(u) + (1 - Math.cos(u)) * Math.cos(u));
  } else {
    // Lissajous Knot (default)
    x = cx + Math.sin(u) * Ax + Math.sin(2 * u) * (Ax * 0.35);
    y = cy + Math.cos(u) * Ay + Math.sin(3 * u) * (Ay * 0.22);
    dx = Math.cos(u) * Ax + 2 * Math.cos(2 * u) * (Ax * 0.35);
    dy = -Math.sin(u) * Ay + 3 * Math.cos(3 * u) * (Ay * 0.22);
  }

  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len;
  const ny = dx / len;

  return { x, y, dx, dy, nx, ny, angle: Math.atan2(dy, dx) };
}

function renderAnim8_Rollercoaster(t, W, H) {
  const variant = state.variationIdx;
  const steps = 180;
  const offsets = [-8, 0, 8];

  // Draw 3 Parallel Ribbon Offset Spline Lines
  ctx.save();
  ctx.lineWidth = 0.8;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.lineCap = 'round';

  offsets.forEach(offset => {
    ctx.beginPath();
    for (let s = 0; s <= steps; s++) {
      const u = (s / steps) * Math.PI * 2;
      const pt = getRollercoasterPos(u, W, H, variant);
      const px = pt.x + pt.nx * offset;
      const py = pt.y + pt.ny * offset;
      if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
  });
  ctx.restore();

  // Train tokens
  const word = state.text.length >= 9 ? state.text : (state.text + "HELVETICA").slice(0, 9);
  const numTokens = 9;

  for (let k = 0; k < numTokens; k++) {
    const u = (t * Math.PI * 2 + (k / numTokens) * Math.PI * 2) % (Math.PI * 2);
    const pt = getRollercoasterPos(u, W, H, variant);

    ctx.save();
    ctx.translate(pt.x, pt.y);
    ctx.rotate(pt.angle);

    ctx.fillStyle = state.bgColor;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(255, 255, 255, 0.3)';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.font = '700 13px Helvetica, Arial, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(word[k], 0, 0);

    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════════════
// ANIMATION 09: TYPOGRAPHY MORPH (GEOMETRY <-> WORDMARK)
// ═══════════════════════════════════════════════════════════════════════

function renderAnim9_Morph(t, W, H) {
  const variant = state.variationIdx; // 0=Geometric, 1=Pixel Grid, 2=Shatter
  const word = state.text.length > 0 ? state.text.toUpperCase() : "HELVETICA";
  const cx = W / 2, cy = H / 2;
  const fontSize = Math.max(48, Math.min(Math.round(W * 0.085), 115));

  const cycle = (t % 1.0);
  let morphT = 0;
  if (cycle < 0.25) {
    morphT = 0;
  } else if (cycle < 0.50) {
    morphT = easeInOutQuint((cycle - 0.25) / 0.25);
  } else if (cycle < 0.75) {
    morphT = 1.0;
  } else {
    morphT = 1.0 - easeInOutQuint((cycle - 0.75) / 0.25);
  }

  ctx.save();
  ctx.translate(cx, cy);

  ctx.font = `900 ${fontSize}px Syne, Helvetica, Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const totalW = ctx.measureText(word).width;
  const charSpacing = totalW / word.length;
  const startX = -totalW / 2 + charSpacing / 2;

  for (let i = 0; i < word.length; i++) {
    const px = startX + i * charSpacing;
    const py = 0;
    const h = fontSize * 0.85;
    const w = charSpacing * 0.75;

    ctx.save();
    ctx.translate(px, py);

    if (morphT < 0.98) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.fillStyle = state.bgColor;
      const alpha = 1 - morphT;
      ctx.globalAlpha = alpha;

      if (variant === 1) {
        // Pixel Grid: grid of small squares
        const gridN = 4;
        const cellW = w / gridN, cellH = h / gridN;
        for (let gr = 0; gr < gridN; gr++) {
          for (let gc = 0; gc < gridN; gc++) {
            const cx2 = -w / 2 + gc * cellW + cellW / 2;
            const cy2 = -h / 2 + gr * cellH + cellH / 2;
            const show = ((gr + gc + i) % 3 !== 0);
            if (show) {
              ctx.strokeRect(cx2 - cellW * 0.4, cy2 - cellH * 0.4, cellW * 0.8, cellH * 0.8);
            }
          }
        }
      } else if (variant === 2) {
        // Shatter: exploding triangular shards
        const shatterAngle = (i * 1.3 + t * Math.PI * 4) * (1 - morphT);
        const shatterDist = (1 - morphT) * 15;
        ctx.save();
        ctx.rotate(shatterAngle * 0.3);
        ctx.translate(Math.sin(i * 2.1 + t * 6) * shatterDist, Math.cos(i * 1.7 + t * 5) * shatterDist);
        // Triangle shard
        ctx.beginPath();
        ctx.moveTo(0, -h / 3);
        ctx.lineTo(-w / 3, h / 4);
        ctx.lineTo(w / 3, h / 4);
        ctx.closePath();
        ctx.stroke();
        // Second shard
        ctx.beginPath();
        ctx.moveTo(-w / 4, -h / 4);
        ctx.lineTo(w / 4, -h / 5);
        ctx.lineTo(0, h / 3);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      } else {
        // Geometric (default): pillars, arches, wedges
        const mode = i % 4;
        if (mode === 0) {
          ctx.strokeRect(-w / 2, -h / 2, w, h);
        } else if (mode === 1) {
          ctx.beginPath();
          ctx.arc(0, 0, w / 2, 0, Math.PI * 2);
          ctx.stroke();
        } else if (mode === 2) {
          ctx.beginPath();
          ctx.moveTo(-w / 2, h / 2);
          ctx.lineTo(w / 2, -h / 2);
          ctx.stroke();
          ctx.strokeRect(-w / 2, -h / 2, w, h);
        } else {
          ctx.strokeRect(-w / 2, -h / 2, w, h);
          ctx.beginPath();
          ctx.arc(0, 0, w / 4, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }

    if (morphT > 0.02) {
      ctx.globalAlpha = morphT;
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(255, 255, 255, 0.3)';
      ctx.shadowBlur = morphT * 8;
      ctx.fillText(word[i], 0, 0);
    }

    ctx.restore();
  }

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
// CANVAS SETUP & RESIZE
// ═══════════════════════════════════════════════════════════════════════

function resizeCanvas() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  state.width = W;
  state.height = H;
  state.dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = W * state.dpr;
  canvas.height = H * state.dpr;
  canvas.style.width = `${W}px`;
  canvas.style.height = `${H}px`;

  ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Mouse tracking
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  state.mouseX = e.clientX - rect.left;
  state.mouseY = e.clientY - rect.top;
  state.isHovering = true;
});

canvas.addEventListener('mouseleave', () => {
  state.isHovering = false;
});

// ═══════════════════════════════════════════════════════════════════════
// BACKGROUND COLOR SYSTEM
// ═══════════════════════════════════════════════════════════════════════

function setBackgroundColor(color) {
  state.bgColor = color;
  document.documentElement.style.setProperty('--bg', color);

  // Compute glass panel tint from bg color
  const r = parseInt(color.slice(1, 3), 16);
  const g = parseInt(color.slice(3, 5), 16);
  const b = parseInt(color.slice(5, 7), 16);
  document.documentElement.style.setProperty('--bg-glass', `rgba(${Math.round(r * 0.7)}, ${Math.round(g * 0.7)}, ${Math.round(b * 0.7)}, 0.7)`);

  document.body.style.background = color;

  // Update active swatch
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  const match = document.querySelector(`.color-swatch[data-color="${color}"]`);
  if (match) match.classList.add('active');
}

// ═══════════════════════════════════════════════════════════════════════
// MAIN RENDER LOOP (60 FPS)
// ═══════════════════════════════════════════════════════════════════════

let lastTime = 0;
let frameCount = 0;
let lastFpsUpdate = performance.now();

function animate(currentTime) {
  if (!lastTime) lastTime = currentTime;
  const dt = Math.min(Math.max((currentTime - lastTime) / 1000, 0), 0.1);
  lastTime = currentTime;

  if (state.playing) {
    state.time += (dt * state.speed) / state.loopDuration;
  }

  const W = state.width;
  const H = state.height;

  // Clear canvas with background color
  ctx.fillStyle = state.bgColor;
  ctx.fillRect(0, 0, W, H);

  // Subtle background motion grid
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
  ctx.lineWidth = 1;
  const gridSize = 40;
  ctx.beginPath();
  for (let x = 0; x < W; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y < H; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  // Render current active animation
  switch (state.currentAnim) {
    case 0: renderAnim1_TypeHull(state.time, W, H); break;
    case 1: renderAnim2_PulleyBelt(state.time, W, H); break;
    case 2: renderAnim3_Swarm(state.time, W, H); break;
    case 3: renderAnim4_VectorField(state.time, W, H); break;
    case 4: renderAnim5_Undulation(state.time, W, H); break;
    case 5: renderAnim6_Network(state.time, W, H); break;
    case 6: renderAnim7_Radar(state.time, W, H); break;
    case 7: renderAnim8_Rollercoaster(state.time, W, H); break;
    case 8: renderAnim9_Morph(state.time, W, H); break;
  }

  // Loop Progress Ring
  const loopFraction = ((state.time % 1.0) + 1.0) % 1.0;
  const strokeOffset = 88 - (loopFraction * 88);
  document.getElementById('loopProgressCircle').style.strokeDashoffset = strokeOffset;
  document.getElementById('loopPercent').textContent = `${Math.round(loopFraction * 100)}%`;

  // FPS Calculation
  frameCount++;
  if (currentTime - lastFpsUpdate >= 500) {
    const fps = Math.round((frameCount * 1000) / (currentTime - lastFpsUpdate));
    document.getElementById('fpsBadge').textContent = `${fps} FPS`;
    frameCount = 0;
    lastFpsUpdate = currentTime;
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

// ═══════════════════════════════════════════════════════════════════════
// UI & EVENT INTERACTION
// ═══════════════════════════════════════════════════════════════════════

lucide.createIcons();

// Build Top 9-Pill Bar
const navBar = document.getElementById('animNavBar');
ANIMATIONS.forEach((anim, idx) => {
  const btn = document.createElement('button');
  btn.className = `anim-btn px-2.5 py-1 rounded-lg text-[10px] font-bold transition-all flex items-center gap-1.5 whitespace-nowrap ${idx === 0 ? 'bg-white text-typoman-blue shadow-[0_0_15px_rgba(255,255,255,0.6)]' : 'text-white/70 hover:text-white hover:bg-white/10'}`;
  btn.innerHTML = `<span class="opacity-60 font-mono text-[8px]">0${idx + 1}</span> <span>${anim.name}</span>`;
  btn.dataset.idx = idx;
  btn.addEventListener('click', () => switchAnimation(idx));
  navBar.appendChild(btn);
});

// Variation Sub-Nav
const varNavBar = document.getElementById('varNavBar');

function buildVariationBar(animIdx) {
  const anim = ANIMATIONS[animIdx];
  varNavBar.innerHTML = '';
  if (!anim.variations || anim.variations.length <= 1) {
    varNavBar.style.display = 'none';
    return;
  }
  varNavBar.style.display = 'flex';
  anim.variations.forEach((name, vi) => {
    const btn = document.createElement('button');
    btn.className = `var-btn px-2 py-0.5 rounded-md text-[9px] font-bold transition-all whitespace-nowrap ${vi === state.variationIdx ? 'bg-white text-typoman-blue shadow-[0_0_10px_rgba(255,255,255,0.5)]' : 'text-white/60 hover:text-white hover:bg-white/10'}`;
    btn.textContent = name;
    btn.dataset.vi = vi;
    btn.addEventListener('click', () => switchVariation(vi));
    varNavBar.appendChild(btn);
  });
}

function switchVariation(vi) {
  state.variationIdx = vi;
  const buttons = document.querySelectorAll('.var-btn');
  buttons.forEach((b, i) => {
    if (i === vi) {
      b.className = 'var-btn px-2 py-0.5 rounded-md text-[9px] font-bold transition-all whitespace-nowrap bg-white text-typoman-blue shadow-[0_0_10px_rgba(255,255,255,0.5)]';
    } else {
      b.className = 'var-btn px-2 py-0.5 rounded-md text-[9px] font-bold transition-all whitespace-nowrap text-white/60 hover:text-white hover:bg-white/10';
    }
  });
}
window.switchVariation = switchVariation;

function switchAnimation(idx) {
  state.currentAnim = idx;
  state.variationIdx = 0;
  const buttons = document.querySelectorAll('.anim-btn');
  buttons.forEach((b, i) => {
    if (i === idx) {
      b.className = 'anim-btn px-2.5 py-1 rounded-lg text-[10px] font-bold transition-all flex items-center gap-1.5 whitespace-nowrap bg-white text-typoman-blue shadow-[0_0_15px_rgba(255,255,255,0.6)]';
    } else {
      b.className = 'anim-btn px-2.5 py-1 rounded-lg text-[10px] font-bold transition-all flex items-center gap-1.5 whitespace-nowrap text-white/70 hover:text-white hover:bg-white/10';
    }
  });

  const anim = ANIMATIONS[idx];
  document.getElementById('animTitle').textContent = anim.title;
  document.getElementById('animDesc').textContent = anim.desc;
  buildVariationBar(idx);
}
window.switchAnimation = switchAnimation;

// Initialize variation bar for default animation
buildVariationBar(0);

// Background Color Swatches
document.querySelectorAll('.color-swatch').forEach(swatch => {
  swatch.addEventListener('click', () => {
    const color = swatch.dataset.color;
    setBackgroundColor(color);
    document.getElementById('bgColorPicker').value = color;
  });
});

// Custom Color Picker
document.getElementById('bgColorPicker').addEventListener('input', e => {
  setBackgroundColor(e.target.value);
});

// Live Text Input
const textInput = document.getElementById('textInput');
textInput.addEventListener('input', e => {
  const val = e.target.value.trim().toUpperCase();
  state.text = val.length > 0 ? val : "HELVETICA";
  initTypeCharacters();
});

// Play / Pause Toggle
const playPauseBtn = document.getElementById('playPauseBtn');
playPauseBtn.addEventListener('click', togglePlay);

function togglePlay() {
  state.playing = !state.playing;
  const icon = document.getElementById('playIcon');
  if (state.playing) {
    icon.setAttribute('data-lucide', 'pause');
  } else {
    icon.setAttribute('data-lucide', 'play');
  }
  lucide.createIcons();
}

// Speed Slider
const speedSlider = document.getElementById('speedSlider');
const speedDisplay = document.getElementById('speedDisplay');
speedSlider.addEventListener('input', e => {
  state.speed = parseFloat(e.target.value);
  speedDisplay.textContent = `${state.speed.toFixed(1)}×`;
});

// Reset Phase
document.getElementById('resetPhaseBtn').addEventListener('click', () => {
  state.time = 0;
});

// Fullscreen Toggle
document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => console.log(err));
  } else {
    document.exitFullscreen().catch(err => console.log(err));
  }
});

// Keyboard Shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;

  if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
  } else if (e.key === 'r' || e.key === 'R') {
    state.time = 0;
  } else if (e.key >= '1' && e.key <= '9') {
    switchAnimation(parseInt(e.key) - 1);
  } else if (e.key === 'ArrowRight') {
    // Next variation
    const maxVar = ANIMATIONS[state.currentAnim].variations.length;
    if (state.variationIdx < maxVar - 1) switchVariation(state.variationIdx + 1);
  } else if (e.key === 'ArrowLeft') {
    // Previous variation
    if (state.variationIdx > 0) switchVariation(state.variationIdx - 1);
  }
});

// URL Query Parameter Deep Linking
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.has('anim')) {
  const val = urlParams.get('anim');
  const num = parseInt(val);
  if (!isNaN(num) && num >= 0 && num < ANIMATIONS.length) {
    switchAnimation(num);
  } else {
    const found = ANIMATIONS.findIndex(a => a.id === val.toLowerCase() || a.name.toLowerCase() === val.toLowerCase());
    if (found !== -1) switchAnimation(found);
  }
}
if (urlParams.has('text')) {
  const txt = urlParams.get('text').trim().toUpperCase();
  if (txt) {
    state.text = txt;
    textInput.value = txt;
    initTypeCharacters();
  }
}
if (urlParams.has('bg')) {
  const bg = urlParams.get('bg');
  if (/^#[0-9a-fA-F]{6}$/.test(bg)) {
    setBackgroundColor(bg);
    document.getElementById('bgColorPicker').value = bg;
  }
}
</script>
