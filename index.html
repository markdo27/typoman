<script>
// ═══════════════════════════════════════════════════════════════════════
// TYPOMAN V3: KINETIC TYPOGRAPHY & DYNAMIC CONVEX HULL ENGINE
// ═══════════════════════════════════════════════════════════════════════

const canvas = document.getElementById('motionCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

// Application State
const state = {
  text: "HELVETICA",
  instances: 4,
  playing: true,
  speed: 1.0,
  loopDuration: 8.0, // 8-second seamless cycle
  time: 0,
  showHull: true,
  currentLayoutIdx: 0,
  width: 0,
  height: 0,
  dpr: Math.min(window.devicePixelRatio || 1, 2)
};

// Layout Metadata
const LAYOUT_META = [
  { title: "LAYOUT A: TRIANGLE", desc: "Tilted sharp triangle with vertices stretched wide" },
  { title: "LAYOUT B: OCTAGON", desc: "Rounded irregular octagon with balanced perimeter" },
  { title: "LAYOUT C: TRAPEZOID", desc: "Slanted, tall trapezoid with staggered diagonals" },
  { title: "LAYOUT D: POLYGON", desc: "Compact asymmetrical polygon with sharp corners" }
];

// ═══════════════════════════════════════════════════════════════════════
// 4 SPATIAL LAYOUT COORDINATE MATRICES
// Normalized [-0.5, 0.5] coordinates for discrete characters.
// Outer letters define the perimeter; interior letters drift within.
// ═══════════════════════════════════════════════════════════════════════

// Generate 36 discrete normalized coordinate points for each layout
function generateLayouts(count) {
  // Layout A: Tilted Sharp Triangle
  // 3 outer vertices: V0=(-0.42, -0.38), V1=(0.44, -0.12), V2=(-0.18, 0.42)
  const layoutA = [];
  const V0 = { x: -0.42, y: -0.38 };
  const V1 = { x: 0.44, y: -0.12 };
  const V2 = { x: -0.18, y: 0.42 };

  const perimeterA = 24;
  const interiorA = count - perimeterA;

  // Along edge 0: V0 -> V1 (8 points)
  for (let i = 0; i < 8; i++) {
    const f = i / 8;
    layoutA.push({
      x: V0.x + (V1.x - V0.x) * f,
      y: V0.y + (V1.y - V0.y) * f,
      isOuter: true
    });
  }
  // Along edge 1: V1 -> V2 (8 points)
  for (let i = 0; i < 8; i++) {
    const f = i / 8;
    layoutA.push({
      x: V1.x + (V2.x - V1.x) * f,
      y: V1.y + (V2.y - V1.y) * f,
      isOuter: true
    });
  }
  // Along edge 2: V2 -> V0 (8 points)
  for (let i = 0; i < 8; i++) {
    const f = i / 8;
    layoutA.push({
      x: V2.x + (V0.x - V2.x) * f,
      y: V2.y + (V0.y - V2.y) * f,
      isOuter: true
    });
  }
  // Interior points inside triangle
  for (let i = 0; i < interiorA; i++) {
    // Barycentric sampling
    const r1 = Math.sqrt((i + 1) / (interiorA + 1));
    const r2 = (i * 0.61803398875) % 1;
    const a = 1 - r1;
    const b = r1 * (1 - r2);
    const c = r1 * r2;
    layoutA.push({
      x: (a * V0.x + b * V1.x + c * V2.x) * 0.78,
      y: (a * V0.y + b * V1.y + c * V2.y) * 0.78,
      isOuter: false
    });
  }

  // Layout B: Rounded Irregular Octagon / Hexagon
  const layoutB = [];
  const perimeterB = 22;
  const interiorB = count - perimeterB;
  const octVertices = [
    { x: -0.32, y: -0.38 },
    { x: 0.08, y: -0.42 },
    { x: 0.38, y: -0.26 },
    { x: 0.44, y: 0.06 },
    { x: 0.30, y: 0.38 },
    { x: -0.06, y: 0.42 },
    { x: -0.38, y: 0.28 },
    { x: -0.44, y: -0.08 }
  ];
  for (let i = 0; i < perimeterB; i++) {
    const t = (i / perimeterB) * octVertices.length;
    const idx = Math.floor(t);
    const frac = t - idx;
    const p1 = octVertices[idx % octVertices.length];
    const p2 = octVertices[(idx + 1) % octVertices.length];
    layoutB.push({
      x: p1.x + (p2.x - p1.x) * frac,
      y: p1.y + (p2.y - p1.y) * frac,
      isOuter: true
    });
  }
  for (let i = 0; i < interiorB; i++) {
    const angle = (i / interiorB) * Math.PI * 2;
    const rad = 0.12 + ((i % 3) * 0.07);
    layoutB.push({
      x: Math.cos(angle) * rad,
      y: Math.sin(angle) * rad * 0.85,
      isOuter: false
    });
  }

  // Layout C: Slanted, Tall Trapezoid
  const layoutC = [];
  const perimeterC = 24;
  const interiorC = count - perimeterC;
  const T0 = { x: -0.20, y: -0.42 }; // Top-left
  const T1 = { x: 0.26, y: -0.34 };  // Top-right
  const T2 = { x: 0.42, y: 0.40 };   // Bottom-right
  const T3 = { x: -0.38, y: 0.38 };  // Bottom-left

  // Top edge (4 points)
  for (let i = 0; i < 4; i++) {
    const f = i / 4;
    layoutC.push({ x: T0.x + (T1.x - T0.x) * f, y: T0.y + (T1.y - T0.y) * f, isOuter: true });
  }
  // Right slanted edge (8 points)
  for (let i = 0; i < 8; i++) {
    const f = i / 8;
    layoutC.push({ x: T1.x + (T2.x - T1.x) * f, y: T1.y + (T2.y - T1.y) * f, isOuter: true });
  }
  // Bottom edge (4 points)
  for (let i = 0; i < 4; i++) {
    const f = i / 4;
    layoutC.push({ x: T2.x + (T3.x - T2.x) * f, y: T2.y + (T3.y - T2.y) * f, isOuter: true });
  }
  // Left slanted edge (8 points)
  for (let i = 0; i < 8; i++) {
    const f = i / 8;
    layoutC.push({ x: T3.x + (T0.x - T3.x) * f, y: T3.y + (T0.y - T3.y) * f, isOuter: true });
  }
  // Interior cascading lines
  for (let i = 0; i < interiorC; i++) {
    const u = ((i % 4) + 1) / 5;
    const v = (Math.floor(i / 4) + 1) / (Math.ceil(interiorC / 4) + 1);
    const topPt = { x: T0.x + (T1.x - T0.x) * u, y: T0.y + (T1.y - T0.y) * u };
    const btmPt = { x: T3.x + (T2.x - T3.x) * u, y: T3.y + (T2.y - T3.y) * u };
    layoutC.push({
      x: topPt.x + (btmPt.x - topPt.x) * v,
      y: topPt.y + (btmPt.y - topPt.y) * v,
      isOuter: false
    });
  }

  // Layout D: Compact Asymmetrical Polygon
  const layoutD = [];
  const perimeterD = 20;
  const interiorD = count - perimeterD;
  const polyVertices = [
    { x: -0.28, y: -0.26 },
    { x: 0.16, y: -0.32 },
    { x: 0.36, y: -0.06 },
    { x: 0.28, y: 0.28 },
    { x: -0.06, y: 0.34 },
    { x: -0.34, y: 0.14 }
  ];
  for (let i = 0; i < perimeterD; i++) {
    const t = (i / perimeterD) * polyVertices.length;
    const idx = Math.floor(t);
    const frac = t - idx;
    const p1 = polyVertices[idx % polyVertices.length];
    const p2 = polyVertices[(idx + 1) % polyVertices.length];
    layoutD.push({
      x: p1.x + (p2.x - p1.x) * frac,
      y: p1.y + (p2.y - p1.y) * frac,
      isOuter: true
    });
  }
  for (let i = 0; i < interiorD; i++) {
    const r = (i + 1) / (interiorD + 1);
    const angle = i * 2.399963; // Golden angle
    layoutD.push({
      x: Math.cos(angle) * 0.16 * Math.sqrt(r),
      y: Math.sin(angle) * 0.16 * Math.sqrt(r),
      isOuter: false
    });
  }

  return [layoutA, layoutB, layoutC, layoutD];
}

// Build discrete character objects
let characters = [];
let layouts = [];

function initCharacters() {
  const text = state.text.toUpperCase();
  const totalLetters = text.length * state.instances;
  characters = [];

  for (let inst = 0; inst < state.instances; inst++) {
    for (let c = 0; c < text.length; c++) {
      characters.push({
        char: text[c],
        index: inst * text.length + c,
        x: 0,
        y: 0,
        targetX: 0,
        targetY: 0,
        driftPhase: Math.random() * Math.PI * 2
      });
    }
  }

  layouts = generateLayouts(characters.length);
}

initCharacters();

// ═══════════════════════════════════════════════════════════════════════
// ANDREW'S MONOTONE CHAIN 2D CONVEX HULL ALGORITHM
// Computes strictly convex polygon of letter center points in O(N log N)
// ═══════════════════════════════════════════════════════════════════════
function convexHull(points) {
  if (points.length <= 2) return points.slice();

  // 1. Sort points lexicographically by x, then y
  const pts = points.slice().sort((a, b) => (a.x === b.x ? a.y - b.y : a.x - b.x));

  // 2D cross product of OA and OB vectors:
  // > 0 for counter-clockwise, < 0 for clockwise, 0 for collinear
  function cross(o, a, b) {
    return (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  }

  // 2. Build lower hull
  const lower = [];
  for (let i = 0; i < pts.length; i++) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], pts[i]) <= 0) {
      lower.pop();
    }
    lower.push(pts[i]);
  }

  // 3. Build upper hull
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], pts[i]) <= 0) {
      upper.pop();
    }
    upper.push(pts[i]);
  }

  // Remove duplicate end points
  lower.pop();
  upper.pop();

  return lower.concat(upper);
}

// ═══════════════════════════════════════════════════════════════════════
// SMOOTH EASING & INTERPOLATION MATH
// ═══════════════════════════════════════════════════════════════════════
function easeInOutQuint(t) {
  return t < 0.5 ? 16 * t * t * t * t * t : 1 + 16 * (--t) * t * t * t * t;
}

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1;
}

// ═══════════════════════════════════════════════════════════════════════
// CANVAS RESIZE & RETINA DPR SCALING
// ═══════════════════════════════════════════════════════════════════════
function resizeCanvas() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  state.width = W;
  state.height = H;
  state.dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = W * state.dpr;
  canvas.height = H * state.dpr;
  canvas.style.width = `${W}px`;
  canvas.style.height = `${H}px`;

  ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ═══════════════════════════════════════════════════════════════════════
// MAIN ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════════════
let lastTime = 0;
let frameCount = 0;
let lastFpsUpdate = performance.now();

function animate(currentTime) {
  if (!lastTime) lastTime = currentTime;
  const dt = Math.min(Math.max((currentTime - lastTime) / 1000, 0), 0.1);
  lastTime = currentTime;

  if (state.playing) {
    state.time += (dt * state.speed) / state.loopDuration;
  }

  const W = state.width;
  const H = state.height;

  // Clear canvas with deep Klein electric blue
  ctx.fillStyle = '#0015ff';
  ctx.fillRect(0, 0, W, H);

  // Draw subtle motion grid
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
  ctx.lineWidth = 1;
  const gridSize = 40;
  ctx.beginPath();
  for (let x = 0; x < W; x += gridSize) {
    ctx.moveTo(x, 0); ctx.lineTo(x, H);
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();

  // Determine current morph stage across 4 layouts (strictly non-negative)
  const cycle = ((state.time % 1.0) + 1.0) % 1.0;
  const stageFraction = cycle * 4;
  const currentStage = Math.min(3, Math.max(0, Math.floor(stageFraction)));
  const nextStage = (currentStage + 1) % 4;
  const stageT = Math.max(0, Math.min(1, stageFraction - currentStage));
  const easedT = easeInOutCubic(stageT);

  // Update layout button UI if stage changed
  if (state.currentLayoutIdx !== currentStage) {
    state.currentLayoutIdx = currentStage;
    updateShapeUI(currentStage);
  }

  const currentLayout = layouts[currentStage];
  const nextLayout = layouts[nextStage];

  // Geometric scale factors responsive to screen bounds
  const spanX = Math.min(W * 0.85, H * 1.35 * 0.85);
  const spanY = Math.min(H * 0.78, W * 0.65);
  const centerX = W / 2;
  const centerY = H / 2;

  // Responsive font size: Helvetica 20-28px
  const fontSize = Math.max(19, Math.min(Math.round(W * 0.022), 28));
  ctx.font = `700 ${fontSize}px Helvetica, Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const letterPoints = [];

  // Interpolate and calculate positions for each character
  for (let i = 0; i < characters.length; i++) {
    const ch = characters[i];
    const pA = currentLayout[i % currentLayout.length];
    const pB = nextLayout[i % nextLayout.length];

    // Individual character stagger for organic fluid flow
    const stagger = (i / characters.length) * 0.06;
    const charT = Math.max(0, Math.min(1, (stageT - stagger) / (1 - stagger * 1.5)));
    const charEased = easeInOutCubic(charT);

    const nx = pA.x + (pB.x - pA.x) * charEased;
    const ny = pA.y + (pB.y - pA.y) * charEased;

    // Organic drift for interior characters
    const isInterior = !pA.isOuter || !pB.isOuter;
    const driftAmp = isInterior ? 5 : 1.5;
    const driftX = Math.sin(state.time * Math.PI * 4 + ch.driftPhase) * driftAmp;
    const driftY = Math.cos(state.time * Math.PI * 3.5 + ch.driftPhase * 1.3) * driftAmp;

    const posX = centerX + nx * spanX + driftX;
    const posY = centerY + ny * spanY + driftY;

    ch.x = posX;
    ch.y = posY;

    letterPoints.push({ x: posX, y: posY, char: ch.char, isOuter: !isInterior });
  }

  // ═════════════════════════════════════════════════════════════════════
  // DYNAMIC CONVEX HULL CALCULATION (Andrew's Monotone Chain)
  // ═════════════════════════════════════════════════════════════════════
  if (state.showHull) {
    const hull = convexHull(letterPoints);

    if (hull.length > 2) {
      ctx.save();
      // 1.5px solid white line enclosing all characters
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      ctx.beginPath();
      ctx.moveTo(hull[0].x, hull[0].y);
      for (let h = 1; h < hull.length; h++) {
        ctx.lineTo(hull[h].x, hull[h].y);
      }
      ctx.closePath();
      ctx.stroke();

      // Subtle vertex markers at hull corners
      ctx.fillStyle = '#ffffff';
      for (let h = 0; h < hull.length; h++) {
        ctx.beginPath();
        ctx.arc(hull[h].x, hull[h].y, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  // ═════════════════════════════════════════════════════════════════════
  // DRAW CHARACTERS (Crisp White Helvetica)
  // ═════════════════════════════════════════════════════════════════════
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < letterPoints.length; i++) {
    const pt = letterPoints[i];
    ctx.fillText(pt.char, pt.x, pt.y);
  }

  // Update Loop Progress Scrubber
  const loopFraction = (state.time % 1.0);
  const strokeOffset = 88 - (loopFraction * 88);
  document.getElementById('loopProgressCircle').style.strokeDashoffset = strokeOffset;
  document.getElementById('loopPercent').textContent = `${Math.round(loopFraction * 100)}%`;

  // FPS Counter calculation
  frameCount++;
  if (currentTime - lastFpsUpdate >= 500) {
    const fps = Math.round((frameCount * 1000) / (currentTime - lastFpsUpdate));
    document.getElementById('fpsBadge').textContent = `${fps} FPS`;
    frameCount = 0;
    lastFpsUpdate = currentTime;
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

// ═══════════════════════════════════════════════════════════════════════
// UI & EVENT INTERACTION
// ═══════════════════════════════════════════════════════════════════════

// Initialize Lucide Icons
lucide.createIcons();

// Shape / Layout Selector
const shapeButtons = document.querySelectorAll('.shape-btn');
shapeButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    const layoutIdx = parseInt(btn.dataset.layout);
    jumpToLayout(layoutIdx);
  });
});

function jumpToLayout(idx) {
  // Jump to start of specified layout stage
  state.time = idx * 0.25;
  updateShapeUI(idx);
}
window.jumpToLayout = jumpToLayout;
window.state = state;

function updateShapeUI(idx) {
  if (idx < 0 || idx >= LAYOUT_META.length) return;
  const meta = LAYOUT_META[idx];
  if (!meta) return;

  shapeButtons.forEach((b, i) => {
    if (i === idx) {
      b.classList.remove('font-medium', 'text-white/80', 'hover:bg-white/10');
      b.classList.add('font-bold', 'bg-white', 'text-typoman-blue', 'shadow-[0_0_15px_rgba(255,255,255,0.6)]');
    } else {
      b.classList.remove('font-bold', 'bg-white', 'text-typoman-blue', 'shadow-[0_0_15px_rgba(255,255,255,0.6)]');
      b.classList.add('font-medium', 'text-white/80', 'hover:bg-white/10');
    }
  });

  document.getElementById('shapeTitle').textContent = meta.title;
  document.getElementById('shapeDesc').textContent = meta.desc;
}

// Live Text Input
const textInput = document.getElementById('textInput');
textInput.addEventListener('input', e => {
  const val = e.target.value.trim().toUpperCase();
  state.text = val.length > 0 ? val : "HELVETICA";
  initCharacters();
});

// Play / Pause Toggle
const playPauseBtn = document.getElementById('playPauseBtn');
playPauseBtn.addEventListener('click', togglePlay);

function togglePlay() {
  state.playing = !state.playing;
  const icon = document.getElementById('playIcon');
  if (state.playing) {
    icon.setAttribute('data-lucide', 'pause');
  } else {
    icon.setAttribute('data-lucide', 'play');
  }
  lucide.createIcons();
}

// Speed Slider
const speedSlider = document.getElementById('speedSlider');
const speedDisplay = document.getElementById('speedDisplay');
speedSlider.addEventListener('input', e => {
  state.speed = parseFloat(e.target.value);
  speedDisplay.textContent = `${state.speed.toFixed(1)}×`;
});

// Convex Hull Toggle
const hullToggleBtn = document.getElementById('hullToggleBtn');
const hullStatusText = document.getElementById('hullStatusText');

function toggleHull() {
  state.showHull = !state.showHull;
  if (state.showHull) {
    hullStatusText.textContent = "HULL ON";
    hullToggleBtn.classList.remove('opacity-60');
    hullToggleBtn.classList.add('bg-white/15');
  } else {
    hullStatusText.textContent = "HULL OFF";
    hullToggleBtn.classList.add('opacity-60');
    hullToggleBtn.classList.remove('bg-white/15');
  }
}

hullToggleBtn.addEventListener('click', toggleHull);

// Reset / Sync Phase
document.getElementById('resetPhaseBtn').addEventListener('click', () => {
  state.time = 0;
});

// Fullscreen Toggle
document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => console.log(err));
  } else {
    document.exitFullscreen().catch(err => console.log(err));
  }
});

// Keyboard Shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;

  if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
  } else if (e.key === 'r' || e.key === 'R') {
    state.time = 0;
  } else if (e.key === 'h' || e.key === 'H') {
    toggleHull();
  } else if (e.key >= '1' && e.key <= '4') {
    jumpToLayout(parseInt(e.key) - 1);
  }
});
</script>
</body>
</html>
