<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TYPOMAN — Kinetic Type Studio</title>
<meta name="description" content="Make animated typography for your projects. Shape the motion path, then embed it on the web or download MP4.">
<meta name="theme-color" content="#0b0b0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Anton&display=swap">
<link rel="stylesheet" href="css/studio.css">
</head>
<body data-tab="presets">
  <a class="skip" href="#inspector">Skip to controls</a>

  <header class="topbar">
    <div class="brand" aria-label="TYPOMAN">
      <span class="logo" aria-hidden="true"></span>
      <span class="wordmark">TYPOMAN</span>
      <span class="tag">Studio</span>
    </div>
    <input id="sceneName" class="scene-name" aria-label="Project name" maxlength="60" spellcheck="false">
    <div class="tools" role="toolbar" aria-label="Project tools">
      <button id="undoBtn" class="icon-btn" type="button" title="Undo (⌘Z)" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button id="redoBtn" class="icon-btn" type="button" title="Redo (⇧⌘Z)" aria-label="Redo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <span class="sep" aria-hidden="true"></span>
      <button id="remixBtn" class="btn ghost" type="button" title="Remix: random preset, font and palette (R)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2"/><circle cx="15.5" cy="15.5" r="1.2"/><circle cx="15.5" cy="8.5" r="1.2"/><circle cx="8.5" cy="15.5" r="1.2"/></svg><span>Remix</span></button>
      <button id="guidesBtn" class="icon-btn" type="button" title="Safe-area guides (G)" aria-label="Toggle safe-area guides"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="6.5" y="8" width="11" height="8" rx="1" stroke-dasharray="2 2"/></svg></button>
      <span class="sep" aria-hidden="true"></span>
      <button id="shareBtn" class="btn" type="button" title="Embed on the web or share a remix link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5"/><path d="m16 7 5 5-5 5"/></svg><span>Embed</span></button>
      <button id="exportBtn" class="btn primary" type="button" title="Download MP4 / WebM / GIF / PNG (⌘E)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg><span>Export</span></button>
    </div>
  </header>

  <nav class="tabs" aria-label="Panels">
    <button type="button" data-tab="presets" class="on">Presets</button>
    <button type="button" data-tab="edit">Edit</button>
  </nav>

  <aside class="panel left" aria-label="Motion presets">
    <div class="panel-head"><h2>Motion</h2><span class="hint-inline">Hover to preview</span></div>
    <div id="gallery" class="gallery"></div>
  </aside>

  <main class="center">
    <div id="stage" class="stage">
      <div id="artboard" class="artboard">
        <canvas id="stageCanvas" aria-label="Animation preview"></canvas>
        <svg id="pathOverlay" class="path-overlay" aria-label="Path editor"></svg>
        <div class="guides" aria-hidden="true"><i class="title-safe"></i><i class="action-safe"></i><i class="cross"></i></div>
        <div class="edit-badge" aria-hidden="true">Editing path. Drag points · double-click to add · Del to remove · Esc to finish</div>
      </div>
    </div>
    <div class="transport" role="group" aria-label="Playback">
      <button id="stepBack" class="icon-btn" type="button" title="Previous frame (←)" aria-label="Previous frame"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14"/><path d="m18 6-8 6 8 6z"/></svg></button>
      <button id="playBtn" class="play" type="button" aria-label="Pause"><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z"/></svg></button>
      <button id="stepFwd" class="icon-btn" type="button" title="Next frame (→)" aria-label="Next frame"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14"/><path d="m6 6 8 6-8 6z"/></svg></button>
      <input id="scrub" class="scrub-bar" type="range" min="0" max="1000" step="1" value="0" aria-label="Timeline">
      <output id="timecode" class="timecode">0.00s</output>
    </div>
  </main>

  <aside class="panel right" aria-label="Inspector">
    <div id="inspector" class="inspector" tabindex="-1"></div>
  </aside>

  <noscript><div class="noscript">TYPOMAN needs JavaScript to animate type.</div></noscript>
  <script src="js/boot.js" data-groups="engine,presets,studio"></script>
</body>
</html>
