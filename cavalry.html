<script>
// ═══════════════════════════════════════════════════════════════════════
// CAVALRY 7-DAY PROCEDURAL ANIMATION ENGINE
// ═══════════════════════════════════════════════════════════════════════

const canvas = document.getElementById('motionCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

// Global Animation State
const state = {
  currentDay: 0,
  text: "CAVALRY",
  playing: true,
  speed: 1.0,
  time: 0,
  theme: 'cobalt',
  width: 0,
  height: 0,
  dpr: Math.min(window.devicePixelRatio || 1, 2)
};

// Theme Definitions based on Design Specs
const THEMES = {
  cobalt: {
    bg: '#030373',
    primary: '#0100EC',
    accent1: '#5C5AFB',
    accent2: '#A3A2FF',
    text: '#F2F8FC',
    subtext: 'rgba(242, 248, 252, 0.4)',
    grid: 'rgba(255, 255, 255, 0.04)'
  },
  void: {
    bg: '#05050A',
    primary: '#181745',
    accent1: '#5C5AFB',
    accent2: '#A3A2FF',
    text: '#FFFFFF',
    subtext: 'rgba(255, 255, 255, 0.3)',
    grid: 'rgba(92, 90, 251, 0.05)'
  },
  chalk: {
    bg: '#F2F8FC',
    primary: '#E0E7FF',
    accent1: '#0100EC',
    accent2: '#5C5AFB',
    text: '#030373',
    subtext: 'rgba(3, 3, 115, 0.35)',
    grid: 'rgba(3, 3, 115, 0.05)'
  }
};

// Animation Metadata
const ANIMATIONS = [
  {
    title: "DAY 01: WAVE DUPLICATOR",
    desc: "Procedural sine & noise wave with character phase offset",
    duration: 3.0 // seconds per loop
  },
  {
    title: "DAY 02: ACCORDION SQUASH",
    desc: "Stepped cubic-bezier compression with elastic overshoot",
    duration: 2.5
  },
  {
    title: "DAY 03: CYLINDRICAL DRUM",
    desc: "3D rotating drum projection with depth perspective falloff",
    duration: 4.0
  },
  {
    title: "DAY 04: COUNTER SLIDE",
    desc: "Alternating multi-tiered staggered rows on beat lock",
    duration: 3.2
  },
  {
    title: "DAY 05: RADIAL BLOOM",
    desc: "Circumference duplicator with kaleidoscope expansion",
    duration: 3.5
  },
  {
    title: "DAY 06: VELOCITY PUNCH",
    desc: "Extreme shear and spring impact with chromatic echo",
    duration: 2.4
  },
  {
    title: "DAY 07: INFINITE ECHO TUNNEL",
    desc: "Concentric depth recursion scaling through color cascades",
    duration: 3.0
  }
];

// Easing Utilities (Snappy Cavalry Curves)
const Ease = {
  // Snappy exponential curve cubic-bezier(0.16, 1, 0.3, 1)
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outBack: (t, s = 1.70158) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2),
  cavalrySnap: t => {
    // Stepped snappy easing: fast leap, spring overshoot, settle
    const c4 = (2 * Math.PI) / 3;
    return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  }
};

// ═══════════════════════════════════════════════════════════════════════
// RESIZE & CANVAS SETUP
// ═══════════════════════════════════════════════════════════════════════
function resize() {
  state.width = window.innerWidth;
  state.height = window.innerHeight;
  canvas.width = Math.floor(state.width * state.dpr);
  canvas.height = Math.floor(state.height * state.dpr);
  canvas.style.width = `${state.width}px`;
  canvas.style.height = `${state.height}px`;
  ctx.scale(state.dpr, state.dpr);
}
window.addEventListener('resize', resize);
resize();

// ═══════════════════════════════════════════════════════════════════════
// DAY 1: WAVE DUPLICATOR
// Staggered character sine waves across stacked lines with trailing echoes
// ═══════════════════════════════════════════════════════════════════════
function renderDay1(t, colors, W, H) {
  const lines = 7;
  const chars = state.text.split('');
  const fontSize = Math.min(W / (chars.length * 0.75), H * 0.13, 90);
  ctx.font = `900 ${fontSize}px Syne, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const lineSpacing = fontSize * 1.05;
  const startY = H / 2 - ((lines - 1) * lineSpacing) / 2;

  for (let l = 0; l < lines; l++) {
    const yBase = startY + l * lineSpacing;
    const isCenter = l === Math.floor(lines / 2);

    // Character spacing
    const totalW = chars.length * (fontSize * 0.65);
    const startX = W / 2 - totalW / 2 + (fontSize * 0.65) / 2;

    for (let c = 0; c < chars.length; c++) {
      const x = startX + c * (fontSize * 0.65);

      // Wave calculation: spatial offset + time
      const spatialPhase = (c * 0.35) + (l * 0.5);
      const wave = Math.sin((t * Math.PI * 2) + spatialPhase);
      const waveCos = Math.cos((t * Math.PI * 2) + spatialPhase);
      
      const yOffset = wave * (fontSize * 0.45);
      const scaleX = 1 + waveCos * 0.15;
      const scaleY = 1 - waveCos * 0.15;

      ctx.save();
      ctx.translate(x, yBase + yOffset);
      ctx.scale(scaleX, scaleY);

      // Trailing Ghost Echo
      ctx.fillStyle = colors.primary;
      ctx.globalAlpha = 0.4;
      ctx.fillText(chars[c], 0, -wave * 6);

      // Accent letter color
      if (isCenter) {
        ctx.fillStyle = c % 2 === 0 ? colors.text : colors.accent2;
        ctx.globalAlpha = 1.0;
      } else {
        const distFromCenter = Math.abs(l - Math.floor(lines / 2));
        ctx.fillStyle = distFromCenter === 1 ? colors.accent1 : colors.subtext;
        ctx.globalAlpha = Math.max(0.2, 1 - distFromCenter * 0.25);
      }

      ctx.fillText(chars[c], 0, 0);
      ctx.restore();
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
// DAY 2: ACCORDION SQUASH
// Rhythmic compression & expansion with staggered character delays
// ═══════════════════════════════════════════════════════════════════════
function renderDay2(t, colors, W, H) {
  const chars = state.text.split('');
  const fontSize = Math.min(W / (chars.length * 0.8), H * 0.22, 140);
  ctx.font = `900 ${fontSize}px Syne, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Loop phase (0 to 1)
  const cycle = (t % 1);
  const snapEase = Ease.outBack((cycle * 2) % 1, 2.2);
  const direction = cycle < 0.5 ? 1 : -1;

  const baseKern = fontSize * 0.7;
  const totalW = chars.length * baseKern;

  // Background ghost pulses
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.font = `900 ${fontSize * 1.8}px Syne, sans-serif`;
  ctx.fillStyle = colors.primary;
  ctx.globalAlpha = 0.25;
  ctx.scale(1 + (1 - snapEase) * 0.15 * direction, 1 - (1 - snapEase) * 0.15 * direction);
  ctx.fillText(state.text, 0, 0);
  ctx.restore();

  // Foreground staggered accordion
  ctx.save();
  ctx.translate(W / 2, H / 2);

  for (let i = 0; i < chars.length; i++) {
    const normIdx = i - (chars.length - 1) / 2;
    const charDelay = Math.abs(normIdx) * 0.08;
    const charCycle = ((t + charDelay) % 1);
    const charSnap = Ease.outBack((charCycle * 2) % 1, 2.5);
    const charDir = charCycle < 0.5 ? 1 : -1;

    const kernOffset = normIdx * baseKern * (1 + (charDir * (1 - charSnap) * 0.4));
    const squashX = 1 + charDir * (1 - charSnap) * 0.35;
    const squashY = 1 - charDir * (1 - charSnap) * 0.35;

    ctx.save();
    ctx.translate(kernOffset, 0);
    ctx.scale(squashX, squashY);

    // Drop shadow echo
    ctx.fillStyle = colors.accent1;
    ctx.globalAlpha = 0.5;
    ctx.fillText(chars[i], 4, 6);

    // Main letter
    ctx.fillStyle = colors.text;
    ctx.globalAlpha = 1.0;
    ctx.fillText(chars[i], 0, 0);
    ctx.restore();
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
// DAY 3: CYLINDRICAL DRUM
// 3D cylindrical drum projection rolling continuously along X-axis
// ═══════════════════════════════════════════════════════════════════════
function renderDay3(t, colors, W, H) {
  const slices = 16;
  const radius = H * 0.42;
  const fontSize = Math.min(W * 0.14, 85);
  ctx.font = `900 ${fontSize}px Syne, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const rotAngle = (t * Math.PI * 2);

  ctx.save();
  ctx.translate(W / 2, H / 2);

  // Render slices sorted by Z-depth
  const sliceList = [];
  for (let i = 0; i < slices; i++) {
    const angle = rotAngle + (i * (Math.PI * 2 / slices));
    const y = Math.sin(angle) * radius;
    const z = Math.cos(angle) * radius;
    sliceList.push({ index: i, angle, y, z });
  }

  // Sort back to front (smaller z rendered first)
  sliceList.sort((a, b) => a.z - b.z);

  sliceList.forEach(s => {
    // Foreshortening and depth scaling
    const scale = (s.z + radius * 1.5) / (radius * 2.5);
    const alpha = Math.max(0.1, (s.z + radius) / (radius * 2));
    const isFacing = s.z > 0;

    ctx.save();
    ctx.translate(0, s.y);
    ctx.scale(1, Math.cos(s.angle)); // Vertical perspective foreshortening

    // Shading
    if (isFacing) {
      ctx.fillStyle = colors.text;
      ctx.globalAlpha = Math.min(1.0, alpha * 1.3);
    } else {
      ctx.fillStyle = colors.accent1;
      ctx.globalAlpha = alpha * 0.4;
    }

    ctx.fillText(state.text, 0, 0);
    ctx.restore();
  });

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
// DAY 4: COUNTER SLIDE
// Alternating rows sliding horizontally at high speed, locking on beat
// ═══════════════════════════════════════════════════════════════════════
function renderDay4(t, colors, W, H) {
  const rows = 8;
  const fontSize = Math.min(W * 0.12, H * 0.12, 80);
  ctx.font = `900 ${fontSize}px Syne, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const rowHeight = H / (rows - 1);
  const textW = ctx.measureText(state.text + "   ").width;

  const cycle = (t % 1);
  // Snappy stepped movement: hold -> fast snap -> hold
  const snapT = Ease.inOutCubic(cycle);

  for (let r = 0; r < rows; r++) {
    const y = r * rowHeight;
    const dir = r % 2 === 0 ? 1 : -1;
    const speedMultiplier = (r % 3 === 0 ? 1.5 : 1.0);

    // Staggered row phase
    const rowOffset = (snapT * textW * dir * speedMultiplier);
    const totalCols = Math.ceil(W / textW) + 3;

    ctx.save();
    // Color pattern
    if (r === Math.floor(rows / 2)) {
      ctx.fillStyle = colors.accent2;
      ctx.globalAlpha = 1.0;
    } else if (r % 2 === 0) {
      ctx.fillStyle = colors.text;
      ctx.globalAlpha = 0.85;
    } else {
      ctx.fillStyle = colors.accent1;
      ctx.globalAlpha = 0.55;
    }

    for (let c = -2; c < totalCols; c++) {
      const x = (c * textW) + (rowOffset % textW);
      ctx.fillText(state.text, x, y);
    }
    ctx.restore();
  }

  // Center alignment guide bars (Cavalry motion motif)
  ctx.strokeStyle = colors.accent1;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W * 0.15, H / 2 - rowHeight * 0.6);
  ctx.lineTo(W * 0.85, H / 2 - rowHeight * 0.6);
  ctx.moveTo(W * 0.15, H / 2 + rowHeight * 0.6);
  ctx.lineTo(W * 0.85, H / 2 + rowHeight * 0.6);
  ctx.stroke();
}

// ═══════════════════════════════════════════════════════════════════════
// DAY 5: RADIAL BLOOM
// Circle array duplicator with characters radiating outward
// ═══════════════════════════════════════════════════════════════════════
function renderDay5(t, colors, W, H) {
  const petals = 12;
  const chars = state.text.split('');
  const maxRadius = Math.min(W, H) * 0.38;
  const fontSize = Math.min(W * 0.08, 45);
  ctx.font = `900 ${fontSize}px Syne, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const pulse = Math.sin(t * Math.PI * 2);
  const rot = t * Math.PI * 2 * 0.5;

  ctx.save();
  ctx.translate(W / 2, H / 2);

  // Concentric Rings
  for (let p = 0; p < petals; p++) {
    const angle = rot + (p * (Math.PI * 2 / petals));
    const rDist = maxRadius * (0.55 + pulse * 0.25);

    ctx.save();
    ctx.rotate(angle);

    // Letter stack radiating outward
    for (let c = 0; c < chars.length; c++) {
      const charR = (c / chars.length) * rDist;
      const charScale = 0.6 + (c / chars.length) * 0.8;

      ctx.save();
      ctx.translate(0, charR);
      ctx.scale(charScale, charScale);

      // Color mapping
      if (c === chars.length - 1) {
        ctx.fillStyle = colors.text;
        ctx.globalAlpha = 1.0;
      } else if (c % 2 === 0) {
        ctx.fillStyle = colors.accent2;
        ctx.globalAlpha = 0.8;
      } else {
        ctx.fillStyle = colors.accent1;
        ctx.globalAlpha = 0.45;
      }

      ctx.fillText(chars[c], 0, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  // Center Monogram Logo
  ctx.font = `900 ${fontSize * 1.5}px Syne, sans-serif`;
  ctx.fillStyle = colors.text;
  ctx.fillText(chars[0], 0, 0);

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
// DAY 6: VELOCITY PUNCH
// Extreme kinetic shear, velocity snap, and spring-loaded impact
// ═══════════════════════════════════════════════════════════════════════
function renderDay6(t, colors, W, H) {
  const chars = state.text.split('');
  const fontSize = Math.min(W / (chars.length * 0.75), H * 0.25, 160);
  ctx.font = `900 ${fontSize}px Syne, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const cycle = (t % 1);
  // Snappy punch cycle
  const punchT = Ease.cavalrySnap((cycle * 2) % 1);
  const dir = cycle < 0.5 ? 1 : -1;

  const shearX = (1 - punchT) * 0.85 * dir;
  const scalePunch = 1 + (1 - punchT) * 0.35;

  ctx.save();
  ctx.translate(W / 2, H / 2);

  // Chromatic Aberration Trails
  [-12, 0, 12].forEach((offset, idx) => {
    ctx.save();
    ctx.transform(1, 0, shearX, 1, offset * (1 - punchT), 0);
    ctx.scale(scalePunch, scalePunch);

    if (idx === 0) {
      ctx.fillStyle = colors.primary;
      ctx.globalAlpha = 0.6;
    } else if (idx === 2) {
      ctx.fillStyle = colors.accent2;
      ctx.globalAlpha = 0.6;
    } else {
      ctx.fillStyle = colors.text;
      ctx.globalAlpha = 1.0;
    }

    ctx.fillText(state.text, 0, 0);
    ctx.restore();
  });

  // Kinetic speed lines
  if (Math.abs(shearX) > 0.15) {
    ctx.strokeStyle = colors.accent1;
    ctx.lineWidth = 3;
    for (let i = -3; i <= 3; i++) {
      const ly = i * (fontSize * 0.3);
      ctx.beginPath();
      ctx.moveTo(-W * 0.4, ly);
      ctx.lineTo(W * 0.4, ly);
      ctx.stroke();
    }
  }

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
// DAY 7: INFINITE ECHO TUNNEL
// Concentric depth recursion scaling through cascading color loops
// ═══════════════════════════════════════════════════════════════════════
function renderDay7(t, colors, W, H) {
  const depthLayers = 14;
  const maxScale = 2.8;
  const minScale = 0.05;
  const fontSize = Math.min(W * 0.22, H * 0.22, 130);
  ctx.font = `900 ${fontSize}px Syne, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const progress = (t % 1);

  ctx.save();
  ctx.translate(W / 2, H / 2);

  for (let i = depthLayers; i >= 0; i--) {
    const layerProg = (i / depthLayers + progress) % 1;
    // Exponential scale expansion towards viewer
    const scale = minScale * Math.pow(maxScale / minScale, layerProg);
    const alpha = Math.sin(layerProg * Math.PI); // Fade in at center, fade out near screen

    // Color gradient across depth
    ctx.save();
    ctx.scale(scale, scale);

    if (layerProg > 0.8) {
      ctx.fillStyle = colors.text;
      ctx.globalAlpha = alpha * 0.9;
    } else if (layerProg > 0.5) {
      ctx.fillStyle = colors.accent2;
      ctx.globalAlpha = alpha * 0.8;
    } else if (layerProg > 0.25) {
      ctx.fillStyle = colors.accent1;
      ctx.globalAlpha = alpha * 0.65;
    } else {
      ctx.fillStyle = colors.primary;
      ctx.globalAlpha = alpha * 0.4;
    }

    ctx.fillText(state.text, 0, 0);
    ctx.restore();
  }

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
// MAIN ANIMATION RENDER LOOP
// ═══════════════════════════════════════════════════════════════════════
let lastTime = performance.now();
let frameCount = 0;
let lastFpsUpdate = performance.now();

function animate(currentTime) {
  const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
  lastTime = currentTime;

  if (state.playing) {
    const anim = ANIMATIONS[state.currentDay];
    state.time += (dt * state.speed) / anim.duration;
  }

  const W = state.width;
  const H = state.height;
  const colors = THEMES[state.theme];

  // Clear canvas with active theme background
  ctx.fillStyle = colors.bg;
  ctx.fillRect(0, 0, W, H);

  // Draw procedural motion grid
  ctx.strokeStyle = colors.grid;
  ctx.lineWidth = 1;
  const gridSize = 36;
  ctx.beginPath();
  for (let x = 0; x < W; x += gridSize) {
    ctx.moveTo(x, 0); ctx.lineTo(x, H);
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();

  // Render current day animation preset
  switch (state.currentDay) {
    case 0: renderDay1(state.time, colors, W, H); break;
    case 1: renderDay2(state.time, colors, W, H); break;
    case 2: renderDay3(state.time, colors, W, H); break;
    case 3: renderDay4(state.time, colors, W, H); break;
    case 4: renderDay5(state.time, colors, W, H); break;
    case 5: renderDay6(state.time, colors, W, H); break;
    case 6: renderDay7(state.time, colors, W, H); break;
  }

  // Update Loop Progress Scrubber
  const loopFraction = (state.time % 1);
  const strokeOffset = 88 - (loopFraction * 88);
  document.getElementById('loopProgressCircle').style.strokeDashoffset = strokeOffset;
  document.getElementById('loopPercent').textContent = `${Math.round(loopFraction * 100)}%`;

  // FPS Counter calculation
  frameCount++;
  if (currentTime - lastFpsUpdate >= 500) {
    const fps = Math.round((frameCount * 1000) / (currentTime - lastFpsUpdate));
    document.getElementById('fpsBadge').textContent = `${fps} FPS`;
    frameCount = 0;
    lastFpsUpdate = currentTime;
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

// ═══════════════════════════════════════════════════════════════════════
// UI & EVENT INTERACTION
// ═══════════════════════════════════════════════════════════════════════

// Initialize Lucide Icons
lucide.createIcons();

// Preset Switcher
const presetButtons = document.querySelectorAll('.preset-btn');
presetButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    const day = parseInt(btn.dataset.day);
    switchDay(day);
  });
});

function switchDay(day) {
  state.currentDay = day;
  presetButtons.forEach((b, i) => {
    if (i === day) {
      b.classList.remove('font-medium', 'text-white/70', 'hover:bg-white/5');
      b.classList.add('font-bold', 'bg-cavalry-electric', 'text-white', 'shadow-[0_0_15px_rgba(1,0,236,0.6)]');
    } else {
      b.classList.remove('font-bold', 'bg-cavalry-electric', 'text-white', 'shadow-[0_0_15px_rgba(1,0,236,0.6)]');
      b.classList.add('font-medium', 'text-white/70', 'hover:bg-white/5');
    }
  });

  const anim = ANIMATIONS[day];
  document.getElementById('animTitle').textContent = anim.title;
  document.getElementById('animDesc').textContent = anim.desc;
}

// Live Text Input
const textInput = document.getElementById('textInput');
textInput.addEventListener('input', e => {
  const val = e.target.value.trim().toUpperCase();
  state.text = val.length > 0 ? val : "CAVALRY";
});

// Play / Pause
const playPauseBtn = document.getElementById('playPauseBtn');
playPauseBtn.addEventListener('click', togglePlay);
function togglePlay() {
  state.playing = !state.playing;
  const icon = document.getElementById('playIcon');
  if (state.playing) {
    icon.setAttribute('data-lucide', 'pause');
  } else {
    icon.setAttribute('data-lucide', 'play');
  }
  lucide.createIcons();
}

// Speed Slider
const speedSlider = document.getElementById('speedSlider');
const speedDisplay = document.getElementById('speedDisplay');
speedSlider.addEventListener('input', e => {
  state.speed = parseFloat(e.target.value);
  speedDisplay.textContent = `${state.speed.toFixed(1)}×`;
});

// Reset Phase
document.getElementById('resetPhaseBtn').addEventListener('click', () => {
  state.time = 0;
});

// Theme Switcher
const themeButtons = document.querySelectorAll('.theme-btn');
function setTheme(theme) {
  if (!THEMES[theme]) return;
  state.theme = theme;

  themeButtons.forEach(b => {
    if (b.dataset.theme === theme) {
      b.classList.add('active-theme', 'text-white', 'bg-cavalry-electric', 'shadow-sm');
      b.classList.remove('text-white/60');
    } else {
      b.classList.remove('active-theme', 'text-white', 'bg-cavalry-electric', 'shadow-sm');
      b.classList.add('text-white/60');
    }
  });

  document.getElementById('appBody').style.backgroundColor = THEMES[theme].bg;
  document.body.setAttribute('data-theme', theme);
}

themeButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    setTheme(btn.dataset.theme);
  });
});

// Fullscreen Toggle
document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => console.log(err));
  } else {
    document.exitFullscreen().catch(err => console.log(err));
  }
});

// Keyboard Shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;

  if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
  }
  // 1-7 for Day 1 to Day 7
  if (e.key >= '1' && e.key <= '7') {
    switchDay(parseInt(e.key) - 1);
  }
});

// URL Query Parameter Deep Linking (?day=0..6, ?text=..., ?theme=cobalt|void|chalk, ?speed=1.0)
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.has('day')) {
  const d = parseInt(urlParams.get('day'));
  if (!isNaN(d) && d >= 0 && d <= 6) {
    switchDay(d);
  }
}
if (urlParams.has('text')) {
  const txt = urlParams.get('text').trim().toUpperCase();
  if (txt) {
    state.text = txt;
    textInput.value = txt;
  }
}
if (urlParams.has('theme')) {
  const th = urlParams.get('theme').toLowerCase();
  setTheme(th);
}
if (urlParams.has('speed')) {
  const sp = parseFloat(urlParams.get('speed'));
  if (!isNaN(sp) && sp >= 0.2 && sp <= 3.0) {
    state.speed = sp;
    speedSlider.value = sp;
    speedDisplay.textContent = `${sp.toFixed(1)}×`;
  }
}
</script>
</body>
